# Home Assistant for House Lulu — config from ./homeassistant
# Run on a host in the home LAN (Linux recommended for SMGW/HAN access).
#
#   cp homeassistant/secrets.yaml.example homeassistant/secrets.yaml
# UI: http://localhost:8123 (host network) or see docs/docker.md
# Start: docker compose --profile ha up -d

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: lulu-house-homeassistant
    volumes:
      - ./homeassistant:/config
    environment:
      TZ: ${TZ:-Europe/Berlin}
    restart: unless-stopped
    network_mode: host
    profiles: ["ha"]

  energy-merge:
    image: python:3.12-slim
    working_dir: /work
    volumes:
      - .:/work
    entrypoint:
      - python3
      - scripts/merge_energy_exports.py
    command:
      - --smartvisio
      - imports/smartvisio.csv
      - --hoymiles
      - imports/hoymiles.csv
    profiles: ["merge"]
